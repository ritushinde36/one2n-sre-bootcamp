name: build-test-push

on:
  push:
    branches:
      - "feature/ci"
      - "main"
    paths:
      - "EX-01/rest-api/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-push:
    runs-on: self-hosted
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/student-rest-api
    defaults:
      run:
        working-directory: EX-01/rest-api
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        run: echo "VERSION=$(git describe --tags --always --dirty)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: EX-01/rest-api/go.mod

      - name: Build API
        run: make build

      - name: Run tests
        run: make test

      - name: Install lint tools if missing
        run: |
          source scripts/install-prerequisites.sh
          install_staticcheck
          install_hadolint

      - name: Run go vet
        run: make vet

      - name: Check gofmt formatting
        run: make fmt

      - name: Run staticcheck
        run: make staticcheck

      - name: Run hadolint
        run: make hadolint

      - name: Docker login
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/docker-config"
          AUTH=$(printf '%s:%s' "${{ github.actor }}" "$GHCR_TOKEN" | base64)
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}\n' "$AUTH" > "$RUNNER_TEMP/docker-config/config.json"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-config" >> "$GITHUB_ENV"

      - name: Docker build
        run: docker build -t "$IMAGE:$VERSION" .

      - name: Docker push
        run: docker push "$IMAGE:$VERSION"


