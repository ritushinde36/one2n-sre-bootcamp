name: student-api-proxy

networks:
  net:

services:
  mysql:
    image: mysql:8.0
    container_name: student-mysql
    env_file: .env
    volumes:
      - student-mysql-data:/var/lib/mysql
    networks:
      - net
    healthcheck:
      # -h 127.0.0.1, not localhost: mysql's client treats "localhost" as a
      # socket connection, which succeeds against the temporary init server
      # before mysqld is actually listening on the network - other
      # containers relying on depends_on/service_healthy would then see
      # "connection refused" despite the healthcheck passing.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: ${IMAGE_NAME:-student-rest-api}:${VERSION:-latest}
    container_name: student-migrate
    env_file: .env
    entrypoint: migrate
    command: ["up"]
    volumes:
      - student-migrate-logs:/var/log/app
    networks:
      - net
    depends_on:
      mysql:
        condition: service_healthy

  api-1:
    build: .
    image: ${IMAGE_NAME:-student-rest-api}:${VERSION:-latest}
    container_name: student-api-1
    env_file: .env
    environment:
      PORT: 8081
    volumes:
      - student-api-1-logs:/var/log/app
    networks:
      - net
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  api-2:
    build: .
    image: ${IMAGE_NAME:-student-rest-api}:${VERSION:-latest}
    container_name: student-api-2
    env_file: .env
    environment:
      PORT: 8082
    volumes:
      - student-api-2-logs:/var/log/app
    networks:
      - net
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8082/healthcheck"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: student-nginx
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - net
    depends_on:
      api-1:
        condition: service_healthy
      api-2:
        condition: service_healthy

volumes:
  student-mysql-data:
  student-migrate-logs:
  student-api-1-logs:
  student-api-2-logs:
