# Structured JSON access log, matching the key names the Go app uses so both
# sides of a request can be correlated. escape=json is required: it escapes
# quotes and control characters in values, which would otherwise produce
# malformed JSON. "backend_server" records which backend served the request -
# nginx's built-in "main" format doesn't include it.
log_format upstreamlog escape=json
    '{'
      '"time":"$time_iso8601",'
      '"client_ip":"$remote_addr",'
      '"remote_user":"$remote_user",'
      '"method":"$request_method",'
      '"path":"$request_uri",'
      '"protocol":"$server_protocol",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"x_forwarded_for":"$http_x_forwarded_for",'
      '"backend_server":"$upstream_addr"'
    '}';

# Both logs are written twice: to a file on the student-nginx-logs volume,
# which survives the container being removed, and to stdout/stderr, which is
# what `docker logs` reads. Writing only to the volume would break
# `docker logs`; writing only to stdout loses the logs with the container.
error_log /var/log/nginx-persist/error.log warn;
error_log /dev/stderr warn;

upstream student_api {
    server api-1:8081;
    server api-2:8082;
}

server {
    listen 8080;
    access_log /var/log/nginx-persist/access.log upstreamlog;
    access_log /dev/stdout upstreamlog;

    location / {
        proxy_pass http://student_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
