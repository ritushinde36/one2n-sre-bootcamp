log_format upstreamlog escape=json
    '{'
      '"time":"$time_iso8601",'
      '"client_ip":"$remote_addr",'
      '"remote_user":"$remote_user",'
      '"method":"$request_method",'
      '"path":"$request_uri",'
      '"protocol":"$server_protocol",'
      '"status":$status,'
      '"body_bytes_sent":$body_bytes_sent,'
      '"referer":"$http_referer",'
      '"user_agent":"$http_user_agent",'
      '"x_forwarded_for":"$http_x_forwarded_for",'
      '"backend_server":"$upstream_addr"'
    '}';

error_log /var/log/nginx-persist/error.log warn;
error_log /dev/stderr warn;

upstream student_api {
    server api-1:8081;
    server api-2:8082;
}

server {
    listen 8080;
    access_log /var/log/nginx-persist/access.log upstreamlog;
    access_log /dev/stdout upstreamlog;

    location / {
        proxy_pass http://student_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
