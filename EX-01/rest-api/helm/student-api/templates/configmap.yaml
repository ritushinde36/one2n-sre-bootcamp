# Plain (non-secret) settings, passed to both containers as environment
# variables. Every value is quoted: a ConfigMap holds only text, and so does
# an environment variable - PORT included.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "student-api.fullname" . }}-config
  labels:
    {{- include "student-api.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.port | quote }}
  GIN_MODE: {{ .Values.ginMode | quote }}
