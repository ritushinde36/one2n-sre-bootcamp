# Synced from Vault by the External Secrets Operator - see
# docs/secrets-management.md. This object only points at the real secret;
# it never holds the DSN itself. The operator creates a Kubernetes Secret
# with the same name, which the pods read. The DSN value stored in Vault
# must point at mysql.student-api.svc's cluster DNS name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "student-api.fullname" . }}-secret
  labels:
    {{- include "student-api.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "student-api.fullname" . }}-secret
    creationPolicy: Owner
  data:
    - secretKey: DSN
      remoteRef:
        key: {{ .Values.externalSecret.vaultKey | quote }}
        property: DSN
