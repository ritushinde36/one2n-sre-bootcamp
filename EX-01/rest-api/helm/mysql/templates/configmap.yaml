# Plain (non-secret) settings, passed to MySQL as environment variables.
# Quoted: a ConfigMap holds only text.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mysql.fullname" . }}-config
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
data:
  MYSQL_DATABASE: {{ .Values.database | quote }}
