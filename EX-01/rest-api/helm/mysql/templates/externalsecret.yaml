# Synced from Vault by the External Secrets Operator - see
# docs/secrets-management.md. This object only points at the real secret;
# it never holds the password itself. The operator creates a Kubernetes
# Secret with the same name, which the pod reads.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mysql.fullname" . }}-secret
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecret.secretStoreName | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ include "mysql.fullname" . }}-secret
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.vaultKey | quote }}
        property: MYSQL_ROOT_PASSWORD
