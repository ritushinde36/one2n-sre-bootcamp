# StatefulSet: the pod keeps a fixed name (mysql-0) and its
# own volume, and Kubernetes never runs two pods with that name at once - two
# mysqld processes can't share /var/lib/mysql.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mysql.fullname" . }}
  labels:
    {{- include "mysql.labels" . | nindent 4 }}
spec:
  # Not a setting: a second pod would get its own empty volume - a separate
  # database, not a copy of this one.
  replicas: 1
  serviceName: {{ include "mysql.fullname" . }}
  selector:
    matchLabels:
      {{- include "mysql.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      # Only the selector labels. The full set carries the chart version,
      # so every chart change would restart the database for nothing.
      labels:
        {{- include "mysql.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mysql
          image: {{ include "mysql.image" . | quote }}
          ports:
            - name: mysql
              containerPort: {{ .Values.port }}
          envFrom:
            - configMapRef:
                name: {{ include "mysql.fullname" . }}-config
            - secretRef:
                name: {{ include "mysql.fullname" . }}-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  # One volume claim per pod, named <template>-<pod>: data-mysql-0. The
  # StatefulSet creates it, not Helm, so `helm uninstall` leaves the claim
  # and the data in place. No labels here: Kubernetes refuses any edit to
  # this block after install, so a label that follows the chart version
  # would make every upgrade fail.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.storage.size | quote }}
