# Our own chart, not a community one. The Bitnami MySQL chart has had no
# release since v14.0.3 (2025-08-14), and its default image
# (docker.io/bitnami/mysql:9.4.0-debian-12-r1) is no longer on Docker Hub.
# The maintained options are operators (Oracle MySQL Operator, Percona). They
# add a controller, CRDs and a multi-pod cluster - too much for one database
# pod. This chart runs the official mysql:8.0 image, with the settings from
# manifests/database.yml.
apiVersion: v2
name: mysql
description: >-
  MySQL for the Student REST API - a one-pod StatefulSet with its own
  volume, a headless Service, a ConfigMap, and the ExternalSecret that pulls
  the root password from Vault.
type: application
# Version of this chart. Bump it whenever anything in this folder changes.
version: 0.1.0
# The mysql image tag deployed when image.tag is empty. `helm list` shows it
# in the APP VERSION column.
appVersion: "8.0"
