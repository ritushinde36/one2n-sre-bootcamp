apiVersion: v2
name: external-secrets
description: >-
  The community External Secrets Operator chart at a fixed version, with our
  settings. The community chart itself is
  charts/external-secrets-2.11.0.tgz, downloaded by
  `helm dependency update`; this chart only adds values.yaml.
type: application
# Version of this chart. Bump it whenever anything in this folder changes,
# including the dependency version below.
version: 0.1.0
dependencies:
  - name: external-secrets
    version: 2.11.0
    repository: https://charts.external-secrets.io
