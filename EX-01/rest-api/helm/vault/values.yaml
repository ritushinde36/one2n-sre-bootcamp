# Our settings for HashiCorp's Vault chart. Everything under "vault:" goes
# to that chart - the key is the dependency's name in Chart.yaml. To see
# every setting the chart has:
#   helm show values helm/vault/charts/vault-0.34.1.tgz
#
# Same settings as manifests/values/vault-values.yaml, which the kubectl
# path uses - keep the two in sync.
vault:
  server:
    dev:
      enabled: false
    standalone:
      enabled: true
    dataStorage:
      enabled: true
      size: 1Gi
    nodeSelector:
      type: dependent_services
    extraInitContainers:
      - name: fix-data-permissions
        image: busybox
        command: ["sh", "-c", "chown -R 100:1000 /vault/data"]
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
        volumeMounts:
          - name: data
            mountPath: /vault/data
  injector:
    # Not used - secrets reach pods through the External Secrets Operator.
    # Left on, it runs an unpinned pod and a webhook that sees every pod
    # created in the cluster.
    enabled: false
