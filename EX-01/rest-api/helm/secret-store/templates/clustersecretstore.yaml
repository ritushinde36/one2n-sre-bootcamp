# Points the External Secrets Operator at Vault. Cluster-scoped (not
# namespaced), so the ExternalSecrets in the student-api and mysql charts
# can reference it by name alone. Requires Vault's Kubernetes auth method
# to already be configured with a matching role - see
# docs/secrets-management.md. The ClusterSecretStore type comes from the
# external-secrets chart: without it installed, Helm stops with "no matches
# for kind ClusterSecretStore".
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name | quote }}
  labels:
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version }}
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  provider:
    vault:
      server: {{ .Values.vault.server | quote }}
      path: {{ .Values.vault.path | quote }}
      version: {{ .Values.vault.version | quote }}
      auth:
        kubernetes:
          mountPath: {{ .Values.vault.authMountPath | quote }}
          role: {{ .Values.vault.role | quote }}
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name | quote }}
            namespace: {{ .Values.serviceAccount.namespace | quote }}
