# Points the External Secrets Operator at Vault. Cluster-scoped (not
# namespaced) so both application.yml and database.yml's ExternalSecrets
# can reference it by name alone. Requires Vault's Kubernetes auth method
# to already be configured with a matching "external-secrets" role - see
# docs/secrets-management.md.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
