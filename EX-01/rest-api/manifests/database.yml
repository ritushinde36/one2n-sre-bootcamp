# MySQL for the Student REST API. Everything this component needs lives in
# this one file: namespace, config, secret, storage, workload, and service.
apiVersion: v1
kind: Namespace
metadata:
  name: student-api
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: student-api
data:
  MYSQL_DATABASE: "student_db"
---
# Synced from Vault by the External Secrets Operator - see
# manifests/secret-store.yml and docs/secrets-management.md. This object
# only points at the real secret; it never holds the password itself.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
  namespace: student-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: db-secret
    creationPolicy: Owner
  data:
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: student-api
        property: MYSQL_ROOT_PASSWORD
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: student-api
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: student-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      # Pins this pod to the node labeled type=database - see docs/minikube.md.
      nodeSelector:
        type: database
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-secret
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          # Mirrors docker-compose.yml's healthcheck. Wrapped in `sh -c` so
          # the shell expands $MYSQL_ROOT_PASSWORD from the container's own
          # environment - kubelet does not interpolate exec probe commands.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "mysqladmin ping -h localhost -uroot -p$MYSQL_ROOT_PASSWORD"
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
---
# Stable DNS name ("mysql", same-namespace short form) that application.yml's
# DSN points at.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: student-api
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
