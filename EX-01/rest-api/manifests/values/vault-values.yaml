# Same settings as helm/vault/values.yaml (under "vault:"), which the Helm
# path uses - keep the two in sync.
server:
  dev:
    enabled: false
  standalone:
    enabled: true
  dataStorage:
    enabled: true
    size: 1Gi
  nodeSelector:
    type: dependent_services
  extraInitContainers:
    - name: fix-data-permissions
      image: busybox
      command: ["sh", "-c", "chown -R 100:1000 /vault/data"]
      securityContext:
        runAsUser: 0
        runAsNonRoot: false
      volumeMounts:
        - name: data
          mountPath: /vault/data
injector:
  # Not used - secrets reach pods through the External Secrets Operator.
  # Left on, it runs an unpinned pod and a webhook that sees every pod
  # created in the cluster.
  enabled: false
