# The ClusterSecretStore, from helm/secret-store. Wave 1. The store is
# cluster-wide - the namespace only matches the Helm way. This app turns
# Healthy only when the store can log in to Vault, so waves 2 and 3 wait until
# Vault is unsealed and configured.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-store
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: student-api
  source:
    repoURL: https://github.com/ritushinde36/one2n-sre-bootcamp.git
    targetRevision: feature/helm-argocd
    path: EX-01/rest-api/helm/secret-store
    helm:
      releaseName: secret-store
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
