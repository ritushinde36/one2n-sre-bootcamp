# The External Secrets Operator, from helm/external-secrets. Wave 0: it adds
# the ExternalSecret and ClusterSecretStore types that waves 1 to 3 use.
# ServerSideApply: some of its CRDs are over 700 KB, and a normal apply copies
# the whole object into an annotation that holds at most 256 KB.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: student-api
  source:
    repoURL: https://github.com/ritushinde36/one2n-sre-bootcamp.git
    targetRevision: main
    path: EX-01/rest-api/helm/external-secrets
    helm:
      releaseName: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
