name: student-api

networks:
  net:

services:
  mysql:
    image: mysql:8.0
    container_name: student-mysql
    env_file: .env
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - student-mysql-data:/var/lib/mysql
    networks:
      - net
    healthcheck:
      # -h 127.0.0.1, not localhost: mysql's client treats "localhost" as a
      # socket connection, which succeeds against the temporary init server
      # before mysqld is actually listening on the network - other
      # containers relying on depends_on/service_healthy would then see
      # "connection refused" despite the healthcheck passing.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    image: ${IMAGE_NAME:-student-rest-api}:${VERSION:-latest}
    container_name: student-migrate
    env_file: .env
    entrypoint: migrate
    command: ["up"]
    volumes:
      - student-migrate-logs:/var/log/app
    networks:
      - net
    depends_on:
      mysql:
        condition: service_healthy

  rest-api:
    build: .
    image: ${IMAGE_NAME:-student-rest-api}:${VERSION:-latest}
    container_name: student-rest-api
    env_file: .env
    environment:
      - PORT=${PORT:-8888}
    ports:
      - "${PORT:-8888}:${PORT:-8888}"
    volumes:
      - student-logs:/var/log/app
    networks:
      - net
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  student-mysql-data:
  student-logs:
  student-migrate-logs:
